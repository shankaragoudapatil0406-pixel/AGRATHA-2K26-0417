<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - AGRATHA 2K26</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/particles.js" defer></script>
</head>
<body>
  <canvas id="particles-canvas"></canvas>
  <nav class="navbar" id="navbar"></nav>
  <div class="auth-wrapper">
    <div class="auth-card fade-in-up">
      <h2>Reset Password</h2>
      <p class="subtitle">Enter your email to receive a reset link</p>
      <!-- Auth Error Display -->
      <div id="auth-error" style="display:none;padding:14px 16px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-sm);color:var(--accent-red);font-size:0.85rem;margin-bottom:20px;line-height:1.5"></div>
      <form onsubmit="handleForgotPassword(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" class="input-field" placeholder="you@college.edu" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Send Reset Link</button>
      </form>
      <p style="text-align:center;margin-top:24px;color:var(--text-secondary);font-size:0.9rem">
        Remember your password? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('forgot');
      initParticles('particles-canvas', 30);
    });
  </script>
</body>
</html>
