<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — VAIBHAV 2K26</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/particles.js" defer></script>
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 100px 24px 40px;
      position: relative;
      background: radial-gradient(ellipse 80% 60% at 50% 30%, rgba(0,240,255,0.05) 0%, transparent 60%);
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 48px 40px;
      width: 100%; max-width: 460px;
      backdrop-filter: blur(20px);
      position: relative;
      overflow: hidden;
    }
    .auth-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(0,240,255,0.04), rgba(189,0,255,0.02));
      pointer-events: none;
    }
    .card-inner { position: relative; z-index: 1; }

    .auth-icon {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(0,240,255,0.15), rgba(189,0,255,0.2));
      border: 1px solid rgba(0,240,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      margin: 0 auto 24px;
      animation: pulseGlowSoft 3s ease-in-out infinite;
    }
    @keyframes pulseGlowSoft {
      0%, 100% { box-shadow: 0 0 10px rgba(0,240,255,0.15); }
      50% { box-shadow: 0 0 30px rgba(0,240,255,0.35); }
    }

    .auth-card h2 {
      font-family: var(--font-heading);
      font-size: 1.8rem; font-weight: 800;
      text-align: center; margin-bottom: 8px;
    }
    .auth-card .subtitle {
      text-align: center; color: var(--text-secondary);
      font-size: 0.9rem; margin-bottom: 36px; line-height: 1.6;
    }

    .auth-error-box {
      display: none; padding: 14px 16px;
      background: rgba(255,51,102,0.08); border: 1px solid rgba(255,51,102,0.25);
      border-radius: var(--radius-sm); color: var(--accent-red);
      font-size: 0.85rem; margin-bottom: 20px; line-height: 1.5;
    }

    /* Success state */
    .success-state {
      display: none;
      text-align: center;
      padding: 20px 0;
      animation: fadeInUp 0.5s ease forwards;
    }
    .success-icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: rgba(0,255,157,0.15);
      border: 2px solid rgba(0,255,157,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; margin: 0 auto 20px;
      animation: successPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes successPop {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .success-state h3 {
      font-family: var(--font-heading); font-size: 1.4rem; margin-bottom: 10px;
    }
    .success-state p { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; }

    .field-group { margin-bottom: 20px; }
    .field-group label {
      display: block; font-size: 0.82rem; font-weight: 600;
      color: var(--text-secondary); margin-bottom: 8px;
    }
    .input-field { transition: all 0.3s; }
    .input-field:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0,240,255,0.1);
    }

    .btn-auth {
      width: 100%; padding: 14px;
      border-radius: var(--radius-sm);
      background: var(--gradient-main); color: #fff;
      font-family: var(--font-heading); font-size: 0.95rem; font-weight: 700;
      border: none; cursor: pointer; transition: all 0.3s;
      box-shadow: 0 4px 20px rgba(0,240,255,0.25);
    }
    .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,240,255,0.4); }
    .btn-auth:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .back-link {
      display: flex; align-items: center; gap: 6px;
      justify-content: center; margin-top: 24px;
      font-size: 0.875rem; color: var(--text-muted);
      transition: color 0.3s;
    }
    .back-link:hover { color: var(--accent-cyan); }
    .back-link i { width: 14px; height: 14px; }

    @media (max-width: 480px) {
      .auth-card { padding: 32px 24px; }
    }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <div class="auth-wrapper">
    <div class="auth-card fade-in-up">
      <div class="card-inner">
        <!-- Default state -->
        <div id="form-state">
          <div class="auth-icon">🔑</div>
          <h2>Reset Password</h2>
          <p class="subtitle">Enter your email and we'll send you a secure link to reset your password.</p>

          <div id="auth-error" class="auth-error-box"></div>

          <form onsubmit="handleForgotPasswordEnhanced(event)">
            <div class="field-group">
              <label>Email Address</label>
              <input type="email" id="email" class="input-field" placeholder="you@college.edu" required>
            </div>
            <button type="submit" class="btn-auth" id="reset-btn">Send Reset Link →</button>
          </form>

          <a href="login.html" class="back-link">
            <i data-lucide="arrow-left"></i>
            Back to Sign In
          </a>
        </div>

        <!-- Success state -->
        <div class="success-state" id="success-state">
          <div class="success-icon">✉️</div>
          <h3>Check Your Email</h3>
          <p>We've sent a password reset link to <strong id="sent-email" style="color:var(--text-primary)"></strong>.<br><br>Click the link in the email to set a new password. If you don't see it, check your spam folder.</p>
          <a href="login.html" class="back-link" style="margin-top:32px">
            <i data-lucide="arrow-left"></i>
            Back to Sign In
          </a>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('forgot');
      if (typeof lucide !== 'undefined') lucide.createIcons();
    });

    async function handleForgotPasswordEnhanced(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('reset-btn');

      btn.disabled = true;
      btn.textContent = 'Sending...';

      // Call the existing handler from auth.js
      // It will show toast + inline error. We also intercept to show success state.
      try {
        if (!window.supabase || !window.supabase.auth) {
          showToast('Supabase not connected', 'error');
          btn.disabled = false;
          btn.textContent = 'Send Reset Link →';
          return;
        }
        const { error } = await supabase.auth.resetPasswordForEmail(email);
        if (error) {
          const errEl = document.getElementById('auth-error');
          errEl.style.display = 'block';
          errEl.textContent = error.message;
          btn.disabled = false;
          btn.textContent = 'Send Reset Link →';
        } else {
          // Show success state
          document.getElementById('form-state').style.display = 'none';
          document.getElementById('sent-email').textContent = email;
          document.getElementById('success-state').style.display = 'block';
          if (typeof lucide !== 'undefined') lucide.createIcons();
        }
      } catch (err) {
        showToast(err.message || 'Failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Send Reset Link →';
      }
    }
  </script>
</body>
</html>
