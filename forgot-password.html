<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - VAIBHAV 2K26</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/particles.js" defer></script>
  <style>
    .auth-icon {
      width: 72px; height: 72px; margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--gradient-main);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
      animation: pulseGlowSoft 3s ease-in-out infinite;
    }
    .input-field {
      transition: all 0.3s;
    }
    .input-field:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.1), 0 0 15px rgba(0, 240, 255, 0.05);
    }
    .auth-footer {
      text-align: center; margin-top: 24px;
      color: var(--text-secondary); font-size: 0.9rem;
    }
    .auth-footer a {
      color: var(--accent-cyan); font-weight: 600;
      position: relative;
    }
    .auth-footer a::after {
      content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
      height: 1px; background: var(--accent-cyan);
      transform: scaleX(0); transition: transform 0.3s;
    }
    .auth-footer a:hover::after { transform: scaleX(1); }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  <div class="auth-wrapper">
    <div class="auth-card fade-in-up">
      <div class="auth-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><lock/><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <h2>Reset Password</h2>
      <p class="subtitle">Enter your email to receive a password reset link</p>
      <div id="auth-error" style="display:none;padding:14px 16px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-sm);color:var(--accent-red);font-size:0.85rem;margin-bottom:20px;line-height:1.5"></div>
      <form onsubmit="handleForgotPassword(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" class="input-field" placeholder="you@college.edu" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Send Reset Link</button>
      </form>
      <p class="auth-footer">
        Remember your password? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('forgot');
      initParticles('particles-canvas', 30);
    });
  </script>
</body>
</html>
