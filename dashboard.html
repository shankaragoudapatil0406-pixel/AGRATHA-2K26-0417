<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - VAIBHAV 2K26</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/particles.js" defer></script>
</head>
<body>
  <canvas id="particles-canvas"></canvas>
  <nav class="navbar" id="navbar"></nav>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content with-sidebar">
    <h1 style="font-family:var(--font-heading);font-size:1.75rem;margin-bottom:8px" id="greeting">Welcome back!</h1>
    <p style="color:var(--text-secondary);margin-bottom:32px">Here's your activity overview</p>
    <div class="grid-4" id="stats-grid">
      <div class="stat-card"><div class="stat-value" id="stat-events">0</div><div class="stat-label">Registered Events</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-teams">0</div><div class="stat-label">Teams Joined</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-tickets">0</div><div class="stat-label">Tickets</div></div>
      <div class="stat-card"><div class="stat-value" id="stat-points">0</div><div class="stat-label">Points</div></div>
    </div>
    <div class="grid-2" style="margin-top:32px">
      <div class="glass-card">
        <h3 style="font-family:var(--font-heading);margin-bottom:16px">My Registered Events</h3>
        <div id="my-events"><div class="loading-spinner"></div></div>
      </div>
      <div class="glass-card">
        <h3 style="font-family:var(--font-heading);margin-bottom:16px">Recent Announcements</h3>
        <div id="recent-announcements"><div class="loading-spinner"></div></div>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await requireAuth('participant');
      if (!user) return;
      renderNavbar('dashboard');
      renderSidebar('participant', 'overview');
      initParticles('particles-canvas', 20);
      if (typeof lucide !== 'undefined') lucide.createIcons();
      document.getElementById('greeting').textContent = 'Welcome, ' + (user.full_name || 'Participant') + '!';

      // Load stats
      const { count: evtCount } = await supabase.from('registrations').select('id', { count: 'exact', head: true }).eq('user_id', user.id);
      const { count: teamCount } = await supabase.from('team_members').select('id', { count: 'exact', head: true }).eq('user_id', user.id);
      document.getElementById('stat-events').textContent = evtCount || 0;
      document.getElementById('stat-teams').textContent = teamCount || 0;
      document.getElementById('stat-tickets').textContent = evtCount || 0;
      document.getElementById('stat-points').textContent = user.points || 0;

      // Load registered events
      const { data: regs } = await supabase.from('registrations').select('*, events(*)').eq('user_id', user.id).limit(5);
      const evDiv = document.getElementById('my-events');
      if (!regs || !regs.length) {
        evDiv.innerHTML = '<div class="empty-state"><p>No events yet. <a href="events.html">Browse events</a></p></div>';
      } else {
        evDiv.innerHTML = regs.map(r => `
          <a href="event-detail.html?id=${r.event_id}" style="display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border-glass);margin-bottom:8px;color:inherit;text-decoration:none;transition:background 0.3s" onmouseover="this.style.background='var(--bg-glass)'" onmouseout="this.style.background='transparent'">
            <div style="width:40px;height:40px;border-radius:var(--radius-sm);background:var(--gradient-main);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">${(r.events?.title || '?').charAt(0)}</div>
            <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.events?.title || 'Event'}</div><div style="font-size:0.75rem;color:var(--text-muted)">${formatDate(r.events?.event_date)}</div></div>
            ${getStatusBadge(r.status || 'confirmed')}
          </a>
        `).join('');
      }

      // Load announcements
      const { data: anns } = await supabase.from('announcements').select('*').order('created_at', { ascending: false }).limit(3);
      const annDiv = document.getElementById('recent-announcements');
      if (!anns || !anns.length) {
        annDiv.innerHTML = '<div class="empty-state"><p>No announcements yet.</p></div>';
      } else {
        annDiv.innerHTML = anns.map(a => `
          <div style="padding:12px;border:1px solid var(--border-glass);border-radius:var(--radius-sm);margin-bottom:8px">
            <div style="font-weight:600;font-size:0.9rem;margin-bottom:4px">${a.title}</div>
            <div style="font-size:0.8rem;color:var(--text-secondary)">${(a.content || '').substring(0, 80)}...</div>
            <div style="font-size:0.7rem;color:var(--text-muted);margin-top:6px">${formatDateTime(a.created_at)}</div>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
