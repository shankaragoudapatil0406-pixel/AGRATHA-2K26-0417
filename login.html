<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VAIBHAV 2K26</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/auth.js?v=2" defer></script>
  <script src="js/particles.js" defer></script>
  <style>
    .auth-icon {
      width: 72px; height: 72px; margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--gradient-main);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
      animation: pulseGlowSoft 3s ease-in-out infinite;
    }
    .social-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 12px;
      border-radius: 50px;
      font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all 0.3s;
      border: 1px solid var(--border-glass);
      background: var(--bg-glass);
      color: var(--text-secondary);
      font-family: var(--font-body);
    }
    .social-btn:hover {
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
      transform: translateY(-2px);
    }
    .divider {
      display: flex; align-items: center; gap: 16px;
      margin: 24px 0; color: var(--text-muted); font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px;
      background: var(--border-glass);
    }
    .input-field {
      transition: all 0.3s;
    }
    .input-field:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.1), 0 0 15px rgba(0, 240, 255, 0.05);
    }
    .forgot-link {
      font-size: 0.85rem; color: var(--text-muted);
      transition: color 0.3s;
    }
    .forgot-link:hover { color: var(--accent-cyan); }
    .auth-footer {
      text-align: center; margin-top: 24px;
      color: var(--text-secondary); font-size: 0.9rem;
    }
    .auth-footer a {
      color: var(--accent-cyan); font-weight: 600;
      position: relative;
    }
    .auth-footer a::after {
      content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
      height: 1px; background: var(--accent-cyan);
      transform: scaleX(0); transition: transform 0.3s;
    }
    .auth-footer a:hover::after { transform: scaleX(1); }

  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  <div class="auth-wrapper">
    <div class="auth-card fade-in-up">
      <div class="auth-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to your VAIBHAV 2K26 account</p>
      <div id="auth-error" style="display:none;padding:14px 16px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-sm);color:var(--accent-red);font-size:0.85rem;margin-bottom:20px;line-height:1.5"></div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" class="input-field" placeholder="you@college.edu" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="input-field" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" required>
        </div>
        <div style="text-align:right;margin-bottom:20px">
          <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
      </form>
      <div class="divider">or continue with</div>
      <button class="social-btn" onclick="socialLogin('google')">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Sign in with Google
      </button>
      <p class="auth-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('login');
      initParticles('particles-canvas', 30);
    });

    function socialLogin(provider) {
      if (window.supabase) {
        supabase.auth.signInWithOAuth({ provider });
      } else {
        showToast('Supabase not connected', 'error');
      }
    }
  </script>
</body>
</html>
