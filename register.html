<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - VAIBHAV 2K26</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/particles.js" defer></script>
  <style>
    .auth-icon {
      width: 72px; height: 72px; margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--gradient-main);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
      animation: pulseGlowSoft 3s ease-in-out infinite;
    }
    .input-field {
      transition: all 0.3s;
    }
    .input-field:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.1), 0 0 15px rgba(0, 240, 255, 0.05);
    }
    .auth-footer {
      text-align: center; margin-top: 24px;
      color: var(--text-secondary); font-size: 0.9rem;
    }
    .auth-footer a {
      color: var(--accent-cyan); font-weight: 600;
      position: relative;
    }
    .auth-footer a::after {
      content: ''; position: absolute; bottom: -2px; left: 0; right: 0;
      height: 1px; background: var(--accent-cyan);
      transform: scaleX(0); transition: transform 0.3s;
    }
    .auth-footer a:hover::after { transform: scaleX(1); }

    .input-hint {
      font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;
    }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  <div class="auth-wrapper">
    <div class="auth-card fade-in-up" style="max-width:520px">
      <div class="auth-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>
      </div>
      <h2>Join VAIBHAV 2K26</h2>
      <p class="subtitle">Create your account and start participating</p>
      <div id="auth-error" style="display:none;padding:14px 16px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-sm);color:var(--accent-red);font-size:0.85rem;margin-bottom:20px;line-height:1.5"></div>
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullName" class="input-field" placeholder="Your full name" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" class="input-field" placeholder="you@college.edu" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="input-field" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" required minlength="6">
          <div class="input-hint">Minimum 6 characters</div>
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="phone" class="input-field" placeholder="+91 98765 43210">
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group">
            <label>College</label>
            <input type="text" id="college" class="input-field" placeholder="College name">
          </div>
          <div class="form-group">
            <label>Department</label>
            <input type="text" id="department" class="input-field" placeholder="CSE, ECE, etc.">
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Create Account</button>
      </form>
      <p class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar('register');
      initParticles('particles-canvas', 30);
    });


  </script>
</body>
</html>
